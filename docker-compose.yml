version: "3.9"

services:
  # ─── Qdrant Vector Database ───────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: career_copilot_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  # ─── Ollama Local LLM ─────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: career_copilot_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    

  # ─── Ollama model pull (run once) ─────────────────────────────────────────
  ollama-init:
    image: ollama/ollama:latest
    container_name: career_copilot_ollama_init
    depends_on:
      - ollama
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      sh -c "
        sleep 5 &&
        ollama pull llama3.2 &&
        ollama pull nomic-embed-text &&
        echo 'Models pulled successfully'
      "
    environment:
      OLLAMA_HOST: http://ollama:11434

  # ─── FastAPI Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: career_copilot_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - ollama
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
      - JSEARCH_API_KEY=${JSEARCH_API_KEY:-}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=info
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
      - backend_db:/app/data

  # ─── Next.js Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: career_copilot_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000

volumes:
  qdrant_data:
  ollama_data:
  backend_uploads:
  backend_db:
